name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Raw binaries named stamper_<os>_<arch>: the layout `stamper self-update` downloads.
      - run: make release VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA::7}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "stamper $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
